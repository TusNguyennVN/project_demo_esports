  <!-- Cyber accents -->
  <line x1="50" y1="20" x2="50" y2="34" stroke="#00f0ff" stroke-width="2"/>
  <line x1="38" y1="62" x2="44" y2="72" stroke="#00f0ff" stroke-width="2"/>
  <line x1="62" y1="62" x2="56" y2="72" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="50" cy="74" r="3" fill="#00f0ff"/>
</svg>
